TASK: few_shot
NUM_GPUS: 1
OUTPUT_DIR: output/sav

FEW_SHOT:
  N_WAY: 5
  K_SHOT: 1
  TRAIN_QUERY_PER_CLASS: 6
  TEST_QUERY_PER_CLASS: 1
  TRAIN_EPISODES: 2000
  TEST_EPISODES: 10000
  CLASS_LOSS_LAMBDA: 1.0
  Q2S_LOSS_LAMBDA: 1.0
  # v1: same candidate text for Support and Query. No early routing/gates.
  LABEL_PRE_TEMPORAL:
    ENABLE: False
  TEXT_CONCAT_ST:
    ENABLE: True
    TEMPORAL_TEXT_TOKENS: 1
    SPATIAL_TEXT_TOKENS: 1
    READOUT: spatial_text_attention
    # Validated on idle 40GB GPUs: retain attention, recompute MLP/readout.
    CLASS_CHUNK_SIZE: 5
    VIDEO_CHUNK_SIZE: 8
    ACTIVATION_CHECKPOINT: False
    MLP_CHECKPOINT: True
    READOUT_CHECKPOINT: True
    CACHE_FROZEN_TEXT: True
  SUPPORT_TEXT_FUSION:
    ENABLE: False
    TEXT_WEIGHT: 1.0
    VISUAL_WEIGHT: 1.0
    VISUAL_DETACH: True
  POT_ROUTE:
    ENABLE: False
    FRAME_SOFTMAX_TAU: 0.04
    QUERY_PARTIAL_ENABLE: True
    QUERY_PARTIAL_LOGIT_ALPHA: 10.0
    QUERY_PARTIAL_LOGIT_BIAS: -2.0
  QUERY_CLASS_MATCHABILITY:
    # Keep known-label BCE masking; the two flags below disable both heads.
    ENABLE: True
    LEARNED_VERIFIER:
      # Inactive in concat v1; retained for historical early-route profiles.
      # Same Raw/text/Support reader; direct learned quality decision (v5).
      # semantic_relation restores the old v3 head for controlled comparisons.
      QUALITY_MODE: relation_decision
      QUALITY_HIDDEN_DIM: 64
      QUALITY_DECISION_LOCAL_DIM: 32
      QUALITY_DECISION_READOUT_DIM: 16
      QUALITY_PATCH_TEMPERATURE: 0.07
      QUALITY_REFERENCE_TEMPERATURE: 0.10
      QUALITY_MAX_POOL_DELTA: 0.5
      QUALITY_MAX_REFERENCE_DELTA: 0.5
      # Used only by semantic_relation, ignored by relation_decision.
      QUALITY_MAX_EVIDENCE_DELTA: 0.10
      QUALITY_SCALE_INIT: 10.0
      QUALITY_BIAS_INIT: 0.0
      QUALITY_RELATION_STRENGTH: 0.0
      # Post cosine evidence with learned smooth pooling/calibration.
      METRIC_TEMPERATURE_INIT: 0.10
      METRIC_SCALE_INIT: 10.0
      DETACH_INPUTS: True
      WEIGHT_DECAY: 0.01
      SEMANTIC_MIL_WEIGHT: 0.0
      RELATION_MIL_WEIGHT: 0.0
      TRANSPORT_WARMUP_FRACTION: 0.05
      QUERY_CHUNK_SIZE: 16
      ACTIVATION_CHECKPOINT: False
      AMP_ENABLE: True
    # Concat v1 requires both OFF. Historical profiles pin their own flags.
    QUALITY_ENABLE: False
    UNIQUENESS_ENABLE: False
    # No m/rho correction to matching, and no auxiliary verifier losses.
    ABSOLUTE_MASS_TRANSPORT_STRENGTH: 0.0
    # At m=0 the visual match is neutral (cosine 0), then the existing -2
    # q2s bias still applies.
    ABSOLUTE_MASS_UNMATCHED_COST: 0.0
    ABSOLUTE_MASS_ONE_SIDED: True
    # Exactly L_global + L_base; skip the duplicate final BCE computation.
    BASE_ONLY_LOSS_ENABLE: True
    DUAL_LOGIT_LOSS_ENABLE: False
    BASE_LOGIT_LOSS_WEIGHT: 1.0
    VERIFIED_LOGIT_LOSS_WEIGHT: 0.0
POINT_INFO:
  NAME: cotracker3_bip_fr_32_feat_dinotxt_vitl14reg4_fps_10
  PT_FIX_SAMPLING_TRAIN: True
  PT_FIX_SAMPLING_TEST: True
  USE_PT_QUERY_MASK: True
  # Spatial readout uses all points; motion keeps its original visibility.
  QUERY_MASK_MODE: all
  SAMPLING_TYPE: cluster_sample
  NUM_POINTS_TO_SAMPLE: 256

TRAIN:
  ENABLE: True
  DATASET: SAV
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: False
  CHECKPOINT_FILE_PATH: ""
  NEW_TRAIN: True
  MIXED_PRECISION: True

DATA:
  PATH_TO_DATA_DIR: data/sav
  PATH_TO_TROKEN_PT_DATA: data/trokens_pt_data
  MULTI_LABEL: True
  USE_RAND_AUGMENT: True
  NUM_FRAMES: 8

SOLVER:
  BASE_LR: 0.0001
  # Effective episodes per update = NUM_GPUS * GRAD_ACCUM_STEPS.
  GRAD_ACCUM_STEPS: 2
  AMP_MIN_SCALE: 0.0001
  LR_POLICY: cosine
  COSINE_AFTER_WARMUP: True
  COSINE_END_LR: 0.000001
  MAX_EPOCH: 20
  WEIGHT_DECAY: 0.5
  WARMUP_EPOCHS: 5
  OPTIMIZING_METHOD: adamw
  TEMPRATURE: 1.0
  WARMUP_START_LR: 1e-06

MODEL:
  NUM_CLASSES: 15
  MODEL_NAME: Pointformer
  LOSS_FUNC: bce_logit
  FEAT_EXTRACTOR: dinotxt_vitl14_reg4
  MOTION_MODULE:
    USE_CROSS_MOTION_MODULE: True
    USE_HOD_MOTION_MODULE: True

TEST:
  ENABLE: True
  DATASET: SAV
  # SAV retains all Query rows when computing Base/Novel AP.
  DROP_EMPTY_QUERY_ROWS: False
  SEEN_LABELS: [0, 2, 4, 6, 7, 8, 10, 13]
  NOVEL_LABELS: [1, 3, 5, 9, 11, 12, 14]

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True
