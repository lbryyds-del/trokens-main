TASK: few_shot
NUM_GPUS: 1
OUTPUT_DIR: output/sav

FEW_SHOT:
  N_WAY: 5
  K_SHOT: 1
  TRAIN_QUERY_PER_CLASS: 6
  TEST_QUERY_PER_CLASS: 1
  TRAIN_EPISODES: 2000
  TEST_EPISODES: 10000
  PATCH_TOKENS_AGG: spatial
  DIST_NORM: none
  TRAIN_OG_EPISODES: False
  SUPPORT_TEXT_FUSION:
    ENABLE: True
    TEXT_WEIGHT: 1.0
    VISUAL_WEIGHT: 1.0
    VISUAL_DETACH: True
  COST_AGG:
    ENABLE: False
    COST_DIM: 32
    GUIDANCE_DIM: 32
    NUM_HEADS: 4
    WINDOW_SIZE: 4
    NUM_LAYERS: 1
    MLP_RATIO: 4.0
    ATTN_DROPOUT: 0.0
    PROJ_DROPOUT: 0.0
    CLASS_AGG:
      ENABLE: False
      GUIDANCE_DIM: 32
      NUM_HEADS: 4
      ATTENTION_TYPE: full
      POOLING_SIZE: 1
      PAD_LEN: 0
      MLP_RATIO: 4.0
      GATE_INIT: 0.0
  POT_ROUTE:
    ENABLE: True
    FRAME_SOFTMAX_TAU: 0.04
    QUERY_PARTIAL_ENABLE: True
    QUERY_PARTIAL_LOGIT_ALPHA: 10.0
    QUERY_PARTIAL_LOGIT_BIAS: -2.0
  # Retain 8.63 for ablation, but do not couple patch routing to a learned Null.
  QUERY_NULL_ROUTE:
    ENABLE: False
    SCORE_INIT: 0.07
    SCORE_MIN: -0.20
    SCORE_MAX: 0.80
    CARDINALITY_CORRECTION: True
    TOKEN_INIT_STD: 0.02
    VALUE_SCALE: 1.0
    DETACH_FRAME_SCALE: True
    ORTHO_WEIGHT: 0.01
    ORTHO_DETACH_SUPPORT: True
  QUERY_CLASS_MATCHABILITY:
    ENABLE: True
    MODE: "positive_confuser_margin"
    # Legacy threshold-mode evidence (kept for R1 rollback/comparison).
    TOPK_PATCHES: 8
    TOPK_FRAMES: 3
    # "post": post-Pointformer tokens; "raw": pre-Pointformer DinoTxt tokens.
    EVIDENCE_SOURCE: "post"
    # Legacy threshold = negative Support evidence + beta * positive/negative gap.
    CALIBRATION_BETA: 0.25
    TEMPERATURE: 0.10
    # Final q2s = original q2s + weight * log(matchability).
    LOG_PENALTY_WEIGHT: 0.25
    LOG_EPS: 0.05
    DETACH_SUPPORT_STATS: True
    RELIABILITY_FALLBACK: False
    MARGIN_TEMPERATURE: 0.10
    MARGIN_BIAS: 0.0
    NEGATIVE_AGGREGATION: "max"
    NEGATIVE_TOPK: 2
    NEGATIVE_TEMPERATURE: 0.10
    DETACH_CONFUSER_SUPPORT: True
    # Keep the 8.66 implementation for rollback, but do not let its local
    # Support margin rewrite the main Query construction weights.
    LOCAL_REFINEMENT_ENABLE: False
    LOCAL_MARGIN_TEMPERATURE: 0.10
    LOCAL_LOGIT_STRENGTH: 0.50
    LOCAL_POSITIVE_AGGREGATION: "topk_mean"
    LOCAL_POSITIVE_TOPK: 2
    LOCAL_NEGATIVE_AGGREGATION: "topk_mean"
    LOCAL_NEGATIVE_TOPK: 2
    LOCAL_NEGATIVE_TEMPERATURE: 0.10
    LOCAL_DETACH_REFERENCES: True
    # Frame specificity verifies the same class-conditioned post-Pointformer
    # patch distribution pi that constructs Q_k. No second text-patch route is
    # built for specificity.
    EVIDENCE_VERIFICATION_ENABLE: True
    EVIDENCE_USE_VISIBILITY: True
    EVIDENCE_POSITIVE_AGGREGATION: "topk_mean"
    EVIDENCE_POSITIVE_TOPK: 2
    EVIDENCE_CONFUSER_AGGREGATION: "topk_mean"
    EVIDENCE_CONFUSER_TOPK: 2
    EVIDENCE_AGGREGATION_TEMPERATURE: 0.10
    EVIDENCE_DETACH_REFERENCES: True
    # Relative target-vs-confuser evidence is combined with absolute mass
    # below into one target-state mass before bidirectional BiMHM.
    FRAME_MARGIN_TEMPERATURE: 0.10
    FRAME_MARGIN_BIAS: 0.0
    # Weak video-label supervision over the strongest Evidence margins.
    EVIDENCE_VIDEO_TOPK_FRAMES: 3
    EVIDENCE_MIL_TEMPERATURE: 0.10
    EVIDENCE_MIL_LOSS_WEIGHT: 0.10
    # Pure-text Raw evidence supplies absolute non-null mass m. Together with
    # frame specificity rho, the single transported target mass is g=m*rho;
    # the rejected confuser/null mass remains outside both BiMHM directions.
    ABSOLUTE_MASS_ENABLE: True
    ABSOLUTE_MASS_SOURCE: "raw"
    ABSOLUTE_MASS_USE_VISIBILITY: True
    ABSOLUTE_MASS_PATCH_TOPK: 8
    ABSOLUTE_MASS_SUPPORT_TOPK_FRAMES: 3
    ABSOLUTE_MASS_CALIBRATION_BETA: 0.25
    ABSOLUTE_MASS_TEMPERATURE: 0.05
    ABSOLUTE_MASS_MIN_SUPPORT_GAP: 0.0
    ABSOLUTE_MASS_DETACH_SUPPORT_STATS: True
    ABSOLUTE_MASS_RELIABILITY_FALLBACK: True
    ABSOLUTE_MASS_TRANSPORT_STRENGTH: 1.0
    # At m=0 the visual match is neutral (cosine 0), then the existing -2
    # q2s bias and global relative penalty still apply.
    ABSOLUTE_MASS_UNMATCHED_COST: 0.0
    ABSOLUTE_MASS_ONE_SIDED: True
    # Train both the untouched base matcher and the verified matcher.
    DUAL_LOGIT_LOSS_ENABLE: True
    BASE_LOGIT_LOSS_WEIGHT: 0.60
    VERIFIED_LOGIT_LOSS_WEIGHT: 0.40
    # User-requested first training run: include the relative penalty in q2s
    # BCE during training as well as in evaluation.
    APPLY_DURING_TRAIN: True
  TEXT_ALIGN:
    ENABLE: False
    LOSS_WEIGHT: 0.1
    LOGIT_SCALE: 10.0

POINT_INFO:
  NAME: cotracker3_bip_fr_32_feat_dinotxt_vitl14reg4_fps_10
  PT_FIX_SAMPLING_TRAIN: True
  PT_FIX_SAMPLING_TEST: True
  USE_PT_QUERY_MASK: True
  SAMPLING_TYPE: cluster_sample
  NUM_POINTS_TO_SAMPLE: 256
  GRID_SIZE: 16

TRAIN:
  ENABLE: True
  DATASET: SAV
  BATCH_SIZE: 32
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: False
  CHECKPOINT_FILE_PATH: ""
  NEW_TRAIN: True
  MIXED_PRECISION: True

DATA:
  PATH_TO_DATA_DIR: data/sav
  PATH_TO_TROKEN_PT_DATA: data/trokens_pt_data
  MULTI_LABEL: True
  REVERSE_INPUT_CHANNEL: True
  USE_OFFSET_SAMPLING: True
  USE_RAND_AUGMENT: True
  DECODING_BACKEND: torchvision
  NUM_FRAMES: 8
  SAMPLING_RATE: 4
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
  MEAN: [0.5, 0.5, 0.5]
  STD: [0.5, 0.5, 0.5]
  TRAIN_JITTER_SCALES_RELATIVE: [0.08, 1.0]
  TRAIN_JITTER_ASPECT_RELATIVE: [0.75, 1.3333]
  INV_UNIFORM_SAMPLE: True
  RANDOM_FLIP: False

AUG:
  NUM_SAMPLE: 1
  ENABLE: False
  DIFFERENT_AUG_PER_FRAME: True
  COLOR_JITTER: 0.0
  AA_TYPE: rand-m7-n4-mstd0.5-inc1
  INTERPOLATION: bicubic
  RE_PROB: 0.0
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: False

SOLVER:
  BASE_LR: 0.0001
  LR_POLICY: steps_with_relative_lrs
  LRS: [1, 0.1, 0.01]
  STEPS: [0, 20, 40]
  MAX_EPOCH: 20
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.5
  WARMUP_EPOCHS: 5
  OPTIMIZING_METHOD: adamw
  TEMPRATURE: 1.0
  WARMUP_START_LR: 1e-06

MODEL:
  NUM_CLASSES: 15
  ARCH: slow
  MODEL_NAME: Pointformer
  LOSS_FUNC: bce_logit
  FEAT_EXTRACTOR: dinotxt_vitl14_reg4
  DINO_CONFIG: None
  VIT_TYPE: None
  RESNET_TYPE: None
  MOTION_MODULE:
    USE_CROSS_MOTION_MODULE: True
    USE_HOD_MOTION_MODULE: True

TEST:
  ENABLE: True
  DATASET: SAV
  BATCH_SIZE: 64
  SEEN_LABELS: [0, 2, 4, 6, 7, 8, 10, 13]
  NOVEL_LABELS: [1, 3, 5, 9, 11, 12, 14]

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True
