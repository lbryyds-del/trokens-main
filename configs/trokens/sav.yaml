TASK: few_shot
NUM_GPUS: 1
OUTPUT_DIR: output/sav

FEW_SHOT:
  N_WAY: 5
  K_SHOT: 1
  TRAIN_QUERY_PER_CLASS: 6
  TEST_QUERY_PER_CLASS: 1
  TRAIN_EPISODES: 2000
  TEST_EPISODES: 10000
  PATCH_TOKENS_AGG: spatial
  DIST_NORM: none
  TRAIN_OG_EPISODES: False
  POT_ROUTE:
    ENABLE: True
    UOT3D_ENTROPIC_EPS: 0.015
    UOT3D_MU_LOGIT_SCALE: 5.0
    UOT3D_RHO_FRAME: 0.30
    UOT3D_RHO_TRAJ: 0.50
    UOT3D_RHO_VIS: 0.50
    UOT3D_TARGET_MIX: 0.85
    UOT3D_TOTAL_MASS: 1.0
    UOT3D_TAU_FRAME: 0.12
    UOT3D_TAU_TRAJ: 0.04
    UOT3D_TAU_VIS: 0.04
    SHARED_TAU_LABEL: 0.07
    SHARED_THETA: 0.2
    SHARED_TAU_STRENGTH: 0.1
    UOT3D_SHARED_ENABLE: True
    UOT3D_SHARED_COST_WEIGHT: 0.5
    UOT3D_SHARED_RATIO: 0.15
    UOT3D_VIS_PRIVATE_WEIGHT: 1.0
    UOT3D_VIS_SHARED_WEIGHT: 1.0
    MAX_ITERS: 50
    STOP_TOL: 1e-4
    DEBUG_ENABLE: True
    DEBUG_FILE: pot_3d_uot_debug.jsonl
    DEBUG_LOG_PERIOD: 20
    DEBUG_MAX_RECORDS: 0
    DEBUG_MAX_SAMPLES_PER_CALL: 2
    DEBUG_TOPK: 8
    DEBUG_RANK0_ONLY: True
    DEBUG_RESET_FILE: True
    DEBUG_SAVE_TOP_TOKENS: True
  TEXT_ALIGN:
    ENABLE: True
    LOSS_WEIGHT: 0.1
    LOGIT_SCALE: 10.0

POINT_INFO:
  NAME: cotracker3_bip_fr_32_feat_dinotxt_vitl14reg4_fps_10
  PT_FIX_SAMPLING_TRAIN: True
  PT_FIX_SAMPLING_TEST: True
  USE_PT_QUERY_MASK: True
  SAMPLING_TYPE: cluster_sample
  NUM_POINTS_TO_SAMPLE: 256
  GRID_SIZE: 16

TRAIN:
  ENABLE: True
  DATASET: SAV
  BATCH_SIZE: 32
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: False
  CHECKPOINT_FILE_PATH: ""
  NEW_TRAIN: True
  MIXED_PRECISION: True

DATA:
  PATH_TO_DATA_DIR: data/sav
  PATH_TO_TROKEN_PT_DATA: data/trokens_pt_data
  MULTI_LABEL: True
  REVERSE_INPUT_CHANNEL: True
  USE_OFFSET_SAMPLING: True
  USE_RAND_AUGMENT: True
  DECODING_BACKEND: torchvision
  NUM_FRAMES: 8
  SAMPLING_RATE: 4
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
  MEAN: [0.5, 0.5, 0.5]
  STD: [0.5, 0.5, 0.5]
  TRAIN_JITTER_SCALES_RELATIVE: [0.08, 1.0]
  TRAIN_JITTER_ASPECT_RELATIVE: [0.75, 1.3333]
  INV_UNIFORM_SAMPLE: True
  RANDOM_FLIP: False

AUG:
  NUM_SAMPLE: 1
  ENABLE: False
  DIFFERENT_AUG_PER_FRAME: True
  COLOR_JITTER: 0.0
  AA_TYPE: rand-m7-n4-mstd0.5-inc1
  INTERPOLATION: bicubic
  RE_PROB: 0.0
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: False

SOLVER:
  BASE_LR: 0.0001
  LR_POLICY: steps_with_relative_lrs
  LRS: [1, 0.1, 0.01]
  STEPS: [0, 20, 40]
  MAX_EPOCH: 20
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.5
  WARMUP_EPOCHS: 5
  OPTIMIZING_METHOD: adamw
  TEMPRATURE: 1.0
  WARMUP_START_LR: 1e-06

MODEL:
  NUM_CLASSES: 15
  ARCH: slow
  MODEL_NAME: Pointformer
  LOSS_FUNC: bce_logit
  FEAT_EXTRACTOR: dinotxt_vitl14_reg4
  DINO_CONFIG: None
  VIT_TYPE: None
  RESNET_TYPE: None
  MOTION_MODULE:
    USE_CROSS_MOTION_MODULE: True
    USE_HOD_MOTION_MODULE: True

TEST:
  ENABLE: True
  DATASET: SAV
  BATCH_SIZE: 64
  SEEN_LABELS: [0, 2, 4, 6, 7, 8, 10, 13]
  NOVEL_LABELS: [1, 3, 5, 9, 11, 12, 14]

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True
