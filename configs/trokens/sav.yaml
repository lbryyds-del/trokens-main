# Final SAV: Query/Support conditioning + rho + trajectory-change rescoring.
# Training protocol matches the seed-1 pilot; final evaluation uses the full pool.
TASK: few_shot
NUM_GPUS: 2
RNG_SEED: 1
OUTPUT_DIR: output/sav/rho_change

FEW_SHOT:
  DECOUPLING:
    QUERY_ENABLE: True
    SUPPORT_ENABLE: True
    RHO_ENABLE: True
  ENTITY_CHANGE:
    ENABLE: True
    STATE_ENABLE: True
    GEO_ENABLE: True
    DETACH_INPUTS: True
    GRANULARITY: cluster
    STRICT_COMMON_REPLAY: False
    CORRESPONDENCE_SHUFFLE: False
    MAX_ENTITIES: 16
    MIN_POINTS: 4
    REF_TOPK: 4
    GEO_NUM_BINS: 16
    GEO_MIN_STEPS: 3
    GEO_SPEED_SCALE: 0.01
    GEO_AMPLITUDE_WEIGHT: 0.25
    STATE_TEMPERATURE_INIT: 0.1
    STATE_SCALE_INIT: 10.0
    GEO_TEMPERATURE_INIT: 0.1
    GEO_SCALE_INIT: 10.0
    LAMBDA_STATE_INIT: 0.0
    LAMBDA_GEO_INIT: 0.0
    STATE_AUX_WEIGHT: 0.05
    GEO_AUX_WEIGHT: 0.05
    LR_MULT: 100.0
  N_WAY: 5
  K_SHOT: 1
  TRAIN_QUERY_PER_CLASS: 6
  TEST_QUERY_PER_CLASS: 1
  TRAIN_EPISODES: 2000
  TEST_EPISODES: 10000
  CLASS_LOSS_LAMBDA: 1.0
  Q2S_LOSS_LAMBDA: 1.0
  TEXT_CONCAT_ST:
    TEMPORAL_TEXT_TOKENS: 1
    SPATIAL_TEXT_TOKENS: 1
    CLASS_CHUNK_SIZE: 5
    VIDEO_CHUNK_SIZE: 8
    ACTIVATION_CHECKPOINT: False
    MLP_CHECKPOINT: True
    READOUT_CHECKPOINT: True
    CACHE_FROZEN_TEXT: True
  QUERY_CLASS_MATCHABILITY:
    LEARNED_VERIFIER:
      METRIC_TEMPERATURE_INIT: 0.10
      METRIC_SCALE_INIT: 10.0
      DETACH_INPUTS: True
      WEIGHT_DECAY: 0.01
      TRANSPORT_WARMUP_FRACTION: 0.05
      QUERY_CHUNK_SIZE: 16
      ACTIVATION_CHECKPOINT: False
      AMP_ENABLE: True

POINT_INFO:
  NAME: cotracker3_bip_fr_32_feat_dinotxt_vitl14reg4_fps_10
  PT_FIX_SAMPLING_TRAIN: True
  PT_FIX_SAMPLING_TEST: True
  USE_PT_QUERY_MASK: True
  QUERY_MASK_MODE: all
  SAMPLING_TYPE: cluster_sample
  NUM_POINTS_TO_SAMPLE: 256
  HOD:
    GET_FEAT: False

TRAIN:
  ENABLE: True
  DATASET: SAV
  EVAL_PERIOD: 1
  EVAL_DATA_CSV: output/sav/conditional_null_audit_20261105_v1/partition/splits/development.csv
  CHECKPOINT_PERIOD: 1
  CHECKPOINT_KEEP_ALL: True
  AUTO_RESUME: False
  CHECKPOINT_FILE_PATH: ""
  NEW_TRAIN: True
  MIXED_PRECISION: True

DATA:
  PATH_TO_DATA_DIR: data/sav
  PATH_TO_TROKEN_PT_DATA: data/trokens_pt_data
  MULTI_LABEL: True
  USE_RAND_AUGMENT: True
  NUM_FRAMES: 8

SOLVER:
  BASE_LR: 0.00003
  GRAD_ACCUM_STEPS: 2
  AMP_MIN_SCALE: 0.0001
  LR_POLICY: cosine
  COSINE_AFTER_WARMUP: True
  COSINE_END_LR: 0.000001
  MAX_EPOCH: 10
  WEIGHT_DECAY: 0.5
  WARMUP_EPOCHS: 3
  OPTIMIZING_METHOD: adamw
  TEMPRATURE: 1.0
  WARMUP_START_LR: 1e-06

MODEL:
  NUM_CLASSES: 15
  MODEL_NAME: Pointformer
  LOSS_FUNC: bce_logit
  FEAT_EXTRACTOR: dinotxt_vitl14_reg4
  TRAIN_BACKBONE: False
  FEATURE_SCALE:
    ENABLE: False
    APPEARANCE_GAIN: 1.0
    HOD_GAIN: 1.0
    CTD_GAIN: 1.0
  MOTION_MODULE:
    USE_CROSS_MOTION_MODULE: False
    USE_HOD_MOTION_MODULE: False

TEST:
  ENABLE: True
  DATASET: SAV
  TEST_EPOCH_NUM: 10
  # Empty selects the original SAV test pool, not the reserved diagnostic subset.
  DATA_CSV: ""
  DROP_EMPTY_QUERY_ROWS: False
  SEEN_LABELS: [0, 2, 4, 6, 7, 8, 10, 13]
  NOVEL_LABELS: [1, 3, 5, 9, 11, 12, 14]

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True
WANDB:
  EXP_NAME: sav_rho_change
