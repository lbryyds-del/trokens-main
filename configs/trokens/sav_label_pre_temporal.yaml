_BASE_: sav.yaml

# Projected-cosine serial control; quality selection is inherited from sav.yaml.
# Explicit overrides preserve this profile when the active sav defaults change.
# v30: unchanged encoding; reuse early weights for main Post pooling; retain Post rho.
OUTPUT_DIR: output/sav_label_pre_temporal_relation_decision_reuse_pre_weights_post_rho_st_bias_cls
FEW_SHOT:
  # Restore the original global classification supervision using the existing
  # conditional encodings; no extra neutral encoder pass.
  CLASS_LOSS_LAMBDA: 1.0
  LABEL_PRE_TEMPORAL:
    ENABLE: True
    SCORING: projected_cosine
    ROUTE_TEMPERATURE: 0.04
    GATE_STRENGTH: 0.25
    TEMPORAL_BIAS_SCALE: 1.0
    SPATIAL_BIAS_SCALE: 1.0
    CLASS_CHUNK_SIZE: 1
    VIDEO_CHUNK_SIZE: 4
    ACTIVATION_CHECKPOINT: True
    BATCH_RAW_QUALITY: False
    MLP_CHECKPOINT: False
    READOUT_CHECKPOINT: False
  QUERY_CLASS_MATCHABILITY:
    LEARNED_VERIFIER:
      ACTIVATION_CHECKPOINT: True
